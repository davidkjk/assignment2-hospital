name: hospital_patient_app
description: 병원 통합 서비스 환자용 모바일 앱
publish_to: 'none'
# [배포 Task 10] 릴리즈 빌드용 버전. flutter가 여기서 versionName(1.0.0)·versionCode(1)를 파생한다.
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  supabase_flutter: ^2.5.6
  http: ^1.2.1
  intl: ^0.19.0
  qr_flutter: ^4.1.0
  firebase_core: ^3.3.0
  firebase_messaging: ^15.0.4
  connectivity_plus: ^6.0.3
  flutter_secure_storage: ^9.2.2
  url_launcher: ^6.3.0
  screen_brightness: ^2.1.2
  uuid: ^4.4.0
  flutter_svg: ^2.0.10 # 브랜드 로고(Phosphor Hospital) 벡터 — 데모·직원웹과 정확 일치
dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.3
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1 # [배포 Task 10] 릴리즈 아이콘 생성기

# [배포 Task 10] 앱 런처 아이콘 — build_release.sh가 `dart run flutter_launcher_icons`로 android/ios 리소스를 생성한다.
# 디자인: 딥틸(#0B6E70) 배경 + 흰 병원 로고(십자+건물). iOS/레거시는 풀 아이콘(app_icon.png,
# 딥틸+흰 로고), Android 8.0+ adaptive는 딥틸 단색 배경 + 흰 로고 foreground.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#0B6E70"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
  fonts:
    # 본문·UI 전역 서체 = Pretendard(데모 --font-sans 정본). 정적 가중치 4종을 번들해 렌더 일치 보장.
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Regular.otf
          weight: 400
        - asset: assets/fonts/Pretendard-Medium.otf
          weight: 500
        - asset: assets/fonts/Pretendard-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Pretendard-Bold.otf
          weight: 700
    # 브랜드 워드마크 전용 서체 = Do Hyeon(데모 .brand-wordmark). 로고·병원명에만 쓴다.
    - family: DoHyeon
      fonts:
        - asset: assets/fonts/DoHyeon-Regular.ttf
          weight: 400
    # 아이콘 서체 = Phosphor(데모 @phosphor-icons/react 정본). core/app_icons.dart가 IconData로 참조.
    # 채움(Fill) 기본 + 방향 캐럿·라디오 링만 Bold. phosphor_flutter 패키지는 final IconData 상속으로
    # 컴파일 불가 → 폰트·코드포인트만 가져와 직접 IconData 생성(app_icons.dart 주석 참고).
    - family: PhosphorFill
      fonts:
        - asset: assets/fonts/Phosphor-Fill.ttf
    - family: PhosphorBold
      fonts:
        - asset: assets/fonts/Phosphor-Bold.ttf
