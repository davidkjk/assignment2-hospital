# gitleaks 설정 — 검토 완료된 오탐(false positive) 허용목록
#
# 실행: gitleaks detect --source . -v   (--config .gitleaks.toml 자동 인식)
# 아래 5건은 2026-09-03 Task 19(Step 5) 보안 스캔에서 전수 검토해 "진짜 비밀 아님"으로 확인한 것.
# 새 항목을 추가할 땐 반드시 사람이 원문을 눈으로 확인한 뒤에만 넣는다.

# 기본 룰셋을 그대로 확장(gitleaks 내장 규칙 사용)
[extend]
useDefault = true

[allowlist]
description = "검토 완료된 오탐 — 공개 데모 키·캐시 키 상수"

regexes = [
  # ① Supabase 로컬/데모 표준 JWT (iss: supabase-demo) — CI에서 로컬 supabase에만 통하는 공개 키.
  #    모든 로컬 Supabase에 배포되는 문서화된 기본값이라 진짜 비밀이 아니다.
  '''eyJpc3MiOiJzdXBhYmFzZS1kZW1v''',
  # ② 오프라인 캐시 키 문자열 상수 (localStorage 키 이름) — 비밀 아님.
  '''upcoming_appointments_v1''',
]

paths = [
  # CI 워크플로의 로컬 supabase 데모 키(위 ①과 동일 대상, 경로로도 한 번 더 명시)
  '''\.github/workflows/ci\.yml''',
]
